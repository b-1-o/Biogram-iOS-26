name: Bootstrap Biogram iOS 26

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Sync source and apply iOS 26 fixes
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/.sync" "$RUNNER_TEMP/biogram-source" "$RUNNER_TEMP/biogram-target"
          mkdir -p "$RUNNER_TEMP/biogram-target"

          git clone --depth 1 --branch main "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/biogram-target"
          git clone --depth 1 --branch biogram-core-stage1 --no-recurse-submodules "https://github.com/b-1-o/Biogram.git" "$RUNNER_TEMP/biogram-source"

          cp "$RUNNER_TEMP/biogram-target/.github/workflows/bootstrap-ios26.yml" "$RUNNER_TEMP/bootstrap-ios26.yml"

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/bootstrap-ios26.yml' \
            "$RUNNER_TEMP/biogram-source/" \
            "$RUNNER_TEMP/biogram-target/"

          mkdir -p "$RUNNER_TEMP/biogram-target/.github/workflows"
          cp "$RUNNER_TEMP/bootstrap-ios26.yml" "$RUNNER_TEMP/biogram-target/.github/workflows/bootstrap-ios26.yml"

          cd "$RUNNER_TEMP/biogram-target"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "submodules/TelegramUI/Sources/AppDelegate.swift",
              """        self.window = window
          self.nativeWindow = window
          // MARK: Swiftgram
          if sgHardReset(present: self.mainWindow?.presentNative, beforePresent: { self.window?.makeKeyAndVisible() }) {
              return true
          }
          // 
          """.replace("// \n", "//\n"),
              """        self.window = window
          self.nativeWindow = window
          // iOS 26 sideload hardening: make the native window visible before optional startup can return.
          self.window?.makeKeyAndVisible()

          // MARK: Swiftgram
          if sgHardReset(present: self.mainWindow?.presentNative, beforePresent: { self.window?.makeKeyAndVisible() }) {
              return true
          }
          //
          """,
          )

          replace_once(
              "submodules/TelegramUI/Sources/AppDelegate.swift",
              """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
          configuration.sharedContainerIdentifier = appGroupName
          configuration.isDiscretionary = false
          """,
              """        let configuration = URLSessionConfiguration.background(withIdentifier: identifier)
          if FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName) != nil {
              configuration.sharedContainerIdentifier = appGroupName
          }
          configuration.isDiscretionary = false
          """,
          )

          replace_once(
              "submodules/TelegramUI/Sources/AppDelegate.swift",
              """        guard let appGroupUrl = maybeAppGroupUrl else {
              self.mainWindow?.presentNative(UIAlertController(title: nil, message: "Error 2", preferredStyle: .alert))
              return true
          }
          """,
              """        let appGroupUrl: URL
          if let sharedAppGroupUrl = maybeAppGroupUrl {
              appGroupUrl = sharedAppGroupUrl
          } else {
              let fallbackUrl = FileManager.default
                  .urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
                  .appendingPathComponent("BiogramShared", isDirectory: true)
              try? FileManager.default.createDirectory(
                  at: fallbackUrl,
                  withIntermediateDirectories: true,
                  attributes: nil
              )
              appGroupUrl = fallbackUrl
              NSLog("[Biogram] App Group unavailable; using private fallback container: %@", fallbackUrl.path)
          }
          """,
          )

          replace_once(
              "Swiftgram/SGDBReset/Sources/File.swift",
              """private func sgDefaultDataPath() -> String? {
              guard let appGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: sgAppGroupIdentifier()) else {
                  return nil
              }
              return (appGroupUrl.path as NSString).appendingPathComponent("telegram-data")
          }
          """,
              """private func sgDefaultDataPath() -> String? {
              if let appGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: sgAppGroupIdentifier()) {
                  return (appGroupUrl.path as NSString).appendingPathComponent("telegram-data")
              }

              let fallbackRoot = FileManager.default
                  .urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
                  .appendingPathComponent("BiogramShared", isDirectory: true)
              try? FileManager.default.createDirectory(
                  at: fallbackRoot,
                  withIntermediateDirectories: true,
                  attributes: nil
              )
              return fallbackRoot.appendingPathComponent("telegram-data", isDirectory: true).path
          }
          """,
          )

          Path("IOS26_SIDELOAD.md").write_text(
              """# Biogram iOS 26 Sideload Build

This fork is based on the current Biogram iOS source snapshot.

The iOS 26 build keeps App Group storage when available, but falls back to the
normal application sandbox when a sideloader cannot authorize the App Group
entitlement. The main window is made visible before optional initialization
paths can return.
""",
              encoding="utf-8",
          )
          PY

          git add -A

          while IFS=$'\t' read -r meta path; do
            set -- $meta
            mode="$1"
            sha="$2"
            if [ "$mode" = "160000" ]; then
              git update-index --add --cacheinfo "160000,$sha,$path"
            fi
          done < <(git -C "$RUNNER_TEMP/biogram-source" ls-files --stage)

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Biogram and harden iOS 26 sideload startup [skip ci]"
            git push origin HEAD:main
          fi
