name: Mirror Biogram source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mirror source repository
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/biogram-source"
          git clone --depth 1 --branch biogram-core-stage1 --no-recurse-submodules https://github.com/b-1-o/Biogram.git "$RUNNER_TEMP/biogram-source"
          cp ".github/workflows/bootstrap-ios26.yml" "$RUNNER_TEMP/bootstrap-ios26.yml"
          rsync -a --delete --exclude ".git" --exclude ".github/workflows/bootstrap-ios26.yml" "$RUNNER_TEMP/biogram-source/" "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap-ios26.yml" .github/workflows/bootstrap-ios26.yml

      - name: Restore source submodule gitlinks
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r meta path; do
            set -- $meta
            mode="$1"
            sha="$2"
            if [ "$mode" = "160000" ]; then
              git update-index --add --cacheinfo "160000,$sha,$path"
            fi
          done < <(git -C "$RUNNER_TEMP/biogram-source" ls-files --stage)

      - name: Commit mirror
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Mirror current Biogram source [skip ci]"
          git push origin HEAD:main